<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>插件设置</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <h1>插件设置</h1>
          <p>配置用于自动翻译的 Gemini API。</p>
        </div>
        <button id="openWords" class="secondary">打开单词本</button>
      </header>

      <section class="card">
        <form id="settingsForm">
          <div class="field">
            <label for="apiKey">Gemini API Key</label>
            <input id="apiKey" name="apiKey" type="password" autocomplete="off" required>
            <span class="hint">
              API Key 只保存在当前浏览器本地。你可以在 Google AI Studio 免费创建。
            </span>
          </div>

          <div class="field">
            <label for="model">Gemini 模型</label>
            <div class="inline-field">
              <select id="modelPreset" name="modelPreset"></select>
              <input id="model" name="model" value="gemini-3.1-flash-lite" required>
            </div>
            <span class="hint">可以选择常用模型，也可以手动填写 AI Studio 中的模型名称。</span>
          </div>

          <div class="field">
            <label for="voice">德语朗读声音</label>
            <div class="inline-field">
              <select id="voice" name="voice"></select>
              <button id="previewVoice" type="button" class="secondary">试听</button>
            </div>
            <span class="hint">声音来自你的操作系统。推荐选择语言标记为 de-DE 的声音。</span>
          </div>

          <button type="submit">保存设置</button>
          <span id="status" class="status" aria-live="polite"></span>
        </form>
      </section>

      <section class="card section-card">
        <h2>模型测试器</h2>
        <p class="hint">
          使用已保存的 API Key 测试多个模型。结果用于比较总耗时、JSON 解析稳定性和翻译质量。
        </p>

        <div class="field">
          <label for="testModels">测试模型列表</label>
          <textarea id="testModels" rows="4"></textarea>
          <span class="hint">每行一个模型名称。展示名是否可用取决于 Gemini API 实际接受的 model id。</span>
        </div>

        <div class="field">
          <label for="testText">选中文本</label>
          <input id="testText" value="treibt">
        </div>

        <div class="field">
          <label for="testContext">上下文</label>
          <textarea id="testContext" rows="4">Unter dem anhaltenden Druck der USA treibt die kubanische Regierung erneut die Liberalisierung der heimischen Wirtschaft voran.</textarea>
        </div>

        <div class="field">
          <label for="testExample">保存到单词本的例句</label>
          <textarea id="testExample" rows="3">Unter dem anhaltenden Druck der USA treibt die kubanische Regierung erneut die Liberalisierung der heimischen Wirtschaft voran.</textarea>
        </div>

        <div class="button-row">
          <button id="runSelectedModelTest" type="button">测试当前模型</button>
          <button id="runAllModelTests" type="button" class="secondary">测试全部模型</button>
        </div>

        <div id="benchmarkResults" class="benchmark-results" aria-live="polite"></div>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
