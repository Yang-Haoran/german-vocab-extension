# VPS deployment: PostgreSQL + Node server. Secrets live in server/.env (never committed).
# The API only listens on 127.0.0.1:3000; expose it to your private network (e.g. Tailscale) instead of the internet.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: german_vocab
      POSTGRES_DB: german_vocab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U german_vocab -d german_vocab"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://german_vocab:${POSTGRES_PASSWORD}@db:5432/german_vocab
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
